<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Difesa in profondita': il contenuto arriva da un report generato a partire da
       codice sorgente non fidato (analizzato dall'agente). Niente script, niente
       risorse esterne; solo stile inline (usato per le variabili --vscode-*). -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'unsafe-inline'; img-src data:;">
  <style>
    :root {
      --bg: var(--vscode-editor-background);
      --border: var(--vscode-panel-border);
      --text: var(--vscode-editor-foreground);
      --link: var(--vscode-textLink-foreground);
      --code-bg: rgba(128, 128, 128, 0.12);
    }
    body {
      font-family: var(--vscode-font-family);
      color: var(--text);
      background: var(--bg);
      padding: 20px;
      line-height: 1.6;
      margin: 0;
    }
    .container { max-width: 900px; margin: 0 auto; }
    .header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 20px;
    }
    .header h1 { margin: 0; font-size: 1.4em; }
    h1, h2, h3, h4 { line-height: 1.3; }
    h2 { border-bottom: 1px solid var(--border); padding-bottom: 4px; margin-top: 28px; }
    a { color: var(--link); }
    code {
      background: var(--code-bg);
      padding: 1px 5px;
      border-radius: 4px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 0.9em;
    }
    pre {
      background: var(--code-bg);
      padding: 12px;
      border-radius: 6px;
      overflow-x: auto;
      border: 1px solid var(--border);
    }
    pre code { background: none; padding: 0; }
    pre.frontmatter {
      border-left: 4px solid var(--link);
      font-size: 0.85em;
      opacity: 0.9;
    }
    blockquote {
      border-left: 4px solid var(--border);
      margin: 12px 0;
      padding: 4px 14px;
      opacity: 0.9;
    }
    hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
    li { margin: 4px 0; }
    table { border-collapse: collapse; width: 100%; margin: 12px 0; }
    th, td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
    th { background: var(--code-bg); }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🛡️ Sibyl — __TITLE__</h1>
    </div>
    <div id="content">__CONTENT__</div>
  </div>
</body>
</html>
