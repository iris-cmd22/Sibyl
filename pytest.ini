[pytest]
# Only collect the project's own test modules; never the repos extracted under
# _work/ or other scratch dirs (they import packages we don't have installed).
testpaths = agent/tests/test_agent.py server/tests/test_server.py
norecursedirs = _work _smoketest_repo _insecure_config_testrepo generated_queries reports knowledge .git .pytest_cache __pycache__
markers =
    codeql: tests that invoke the CodeQL CLI (slow; build/analyze databases)
    llm: end-to-end tests that drive a local Ollama model (very slow, model-dependent)
# Default: run everything. To run only fast tests:
#   pytest -m "not codeql and not llm"
